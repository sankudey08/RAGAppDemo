[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-app-demo"
version = "0.1.0"
description = "Local retrieval-augmented generation application foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5,<1.0",
    "langgraph>=0.2,<1.0",
    "ollama>=0.4,<1.0",
    "Pillow>=10.0,<13.0",
    "pydantic-settings>=2.6,<3.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "pytesseract>=0.3.13,<1.0",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
rag-app = "rag_app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["rag_app*"]
